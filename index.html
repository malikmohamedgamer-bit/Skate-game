<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#11151c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Bolt Skate: a 3D skateboarding and scootering game in your browser." />
    <title>Bolt Skate</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311151c'/%3E%3Cpath d='M36 6 14 36h14l-4 22 24-32H34z' fill='%23ffb000'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="src/ui/styles.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.min.js" } }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" role="img" aria-label="3D view of the rider and the map"></canvas>
      <div id="hud" class="hud" hidden></div>
      <div id="touch-controls" class="touch-controls" hidden></div>
      <div id="captions" class="captions" aria-hidden="true"></div>
      <div id="screens"></div>
      <div id="rotate-prompt" class="rotate-prompt" role="alertdialog" aria-labelledby="rotate-title" hidden>
        <div class="rotate-icon" aria-hidden="true">⟳</div>
        <h2 id="rotate-title">Please rotate your device</h2>
        <p>Bolt Skate plays in landscape. Turn your phone sideways to continue.</p>
      </div>
      <div id="boot" class="boot" role="status" aria-live="polite">Loading Bolt Skate…</div>
    </div>
    <div id="sr-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="sr-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
    <noscript><p class="boot">Bolt Skate needs JavaScript enabled.</p></noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
